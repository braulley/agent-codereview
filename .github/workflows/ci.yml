name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests --select E,W,F
      - name: Format
        run: ruff format --check src tests
      - name: Typecheck
        run: mypy --strict src
      - name: Test
        run: pytest -q --cov=src/core --cov-fail-under=80

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Audit client bundle for product keys
        run: |
          if grep -R -E 'GEMINI_API_KEY|GITHUB_TOKEN|GITLAB_TOKEN' .next; then
            echo "Product key identifiers found in frontend/.next"
            exit 1
          fi
          echo "No GEMINI_API_KEY, GITHUB_TOKEN, or GITLAB_TOKEN strings in .next"
